name: Run tests

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "html/changelogs/**"
      - "html/changelog.html"
    branches:
      - master
  pull_request:
    branches:
      - master

# AQUILA - nowy push do PR-a anuluje przebieg poprzedniego commita (17.11.2026: 22 z 62 przebiegow liczylo
# commit, ktory juz nie byl ostatni). Przebiegi mastera maja grupe na commit, wiec zaden nie jest anulowany.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  run_linters:
    runs-on: ubuntu-22.04
    # if: github.repository == 'BeeStation/NSV13'
    steps:
      - uses: actions/checkout@v4
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup cache
        id: cache-spacemandmm
        uses: actions/cache@v4
        with:
          path: ~/dreamchecker
          key: ${{ runner.os }}-spacemandmm-cache-${{ hashFiles('dependencies.sh') }}
      - name: Install SpacemanDMM
        if: steps.cache-spacemandmm.outputs.cache-hit != 'true'
        run: bash tools/ci/install_spaceman_dmm.sh dreamchecker
      - name: Install Tools
        run: |
          pip install setuptools
          bash tools/ci/install_node.sh
          bash tools/ci/install_auxmos.sh
          pip install -r tools/requirements.txt
      - name: Run Linters
        run: |
          bash tools/ci/check_filedirs.sh nsv13.dme
          bash tools/ci/check_changelogs.sh
          find . -name "*.php" -print0 | xargs -0 -n1 php -l
          find . -name "*.json" -not -path "*/node_modules/*" -print0 | xargs -0 python ./tools/json_verifier.py
          bash tools/ci/check_grep.sh
          python3 tools/ci/check_alt_click_loot.py
          # AQUILA - urwane rury i terminale bez kabla na mapach (stare błędy w tools/ci/map_connections_baseline.txt)
          python tools/ci/check_map_connections.py
          tools/build/build --ci lint tgui-test tgui
          tools/bootstrap/python -m dmi.test
          tools/bootstrap/python -m mapmerge2.dmm_test
          ~/dreamchecker
      # AQUILA - wersja angielska (moduł do odpięcia): nowe polskie teksty bez wpisu w słowniku EN jako
      # ostrzeżenia, PR-a nie blokuje. Teksty okien z drzewa składni (tgui/i18n-jsx.cjs), więc po budowie tgui
      - name: Teksty bez angielskiego
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.base_ref }}
          python tools/i18n/list_missing.py --changed origin/${{ github.base_ref }}
  compile_all_maps:
    # AQUILA - mapy w rownoleglych czesciach (--map-shard, tools/build/build.js). dm wczytuje mapy w czasie rosnacym
    # z kwadratem ich liczby: 821 map w jednym jobie to 376 s samego wczytywania.
    # Liczba czesci to tylko lista matrix.shard
    name: compile_all_maps (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Setup cache
        id: cache-byond
        uses: actions/cache@v4
        with:
          path: ~/BYOND
          key: ${{ runner.os }}-byond-cache-${{ hashFiles('dependencies.sh') }}
      - name: Install BYOND
        if: steps.cache-byond.outputs.cache-hit != 'true'
        run: bash tools/ci/install_byond.sh
      # AQUILA - paczki i386 z cache zamiast apt-get update i pobierania w kazdym jobie (tools/ci/apt_install.sh)
      - name: Runner image version
        id: image
        run: echo "version=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - name: Setup i386 package cache
        uses: actions/cache@v4
        with:
          path: ~/apt-i386
          key: apt-i386-v2-${{ steps.image.outputs.version }}-libssl3-libcurl4
      - name: Install libcurl (needed by BYOND 516.1664+ on Linux)
        run: APT_DEB_CACHE=$HOME/apt-i386 bash tools/ci/apt_install.sh libssl3:i386 libcurl4:i386
      # AQUILA - ostrzezenie (nie blad), gdy czesc map kompiluje sie za dlugo: czas rosnie z kwadratem liczby map
      - name: Compile All Maps
        run: |
          source $HOME/BYOND/byond/bin/byondsetup
          started=$SECONDS
          tools/build/build --ci dm -DCIBUILDING -DCITESTING -DALL_MAPS --map-shard=${{ matrix.shard }}/${{ strategy.job-total }}
          elapsed=$((SECONDS - started))
          if [ "$elapsed" -gt 200 ]; then
            echo "::warning title=Wolna kompilacja map::Czesc ${{ matrix.shard }}/${{ strategy.job-total }} kompilowala sie ${elapsed} s (limit 200 s). Dopisz czesc do matrix.shard joba compile_all_maps."
          fi
  run_all_tests:
    # AQUILA - testy w rownoleglych czesciach (UNIT_TEST_SHARD, aquila/code/modules/unit_tests/_unit_test_shards.dm).
    # Liczba czesci to tylko lista matrix.shard; nazwa i zmienna biora ja ze strategy.job-total
    name: run_all_tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # AQUILA - wiszacy serwer przed "Shutdown complete" czekalby do domyslnych 6 godzin
    timeout-minutes: 90
    # AQUILA - bez kontenera uslugi mysql: testy lacza sie z MySQL-em runnera (127.0.0.1:3306, krok "Setup database"),
    # a kontener wystawial losowy port i nikt z niego nie korzystal. Jego pobranie zajmowalo ok. 25 s kazdej czesci.
    steps:
      - uses: actions/checkout@v4
      - name: Setup cache
        id: cache-byond
        uses: actions/cache@v4
        with:
          path: ~/BYOND
          key: ${{ runner.os }}-byond-cache-${{ hashFiles('dependencies.sh') }}
      - name: Install BYOND
        if: steps.cache-byond.outputs.cache-hit != 'true'
        run: bash tools/ci/install_byond.sh
      - name: Setup database
        run: |
          sudo systemctl start mysql
          mysql -u root -proot -e 'CREATE DATABASE bee_ci;'
          mysql -u root -proot bee_ci < SQL/beestation_schema.sql
      # AQUILA - paczki i386 z cache zamiast apt-get update i pobierania w kazdym jobie (tools/ci/apt_install.sh)
      - name: Runner image version
        id: image
        run: echo "version=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - name: Setup i386 package cache
        uses: actions/cache@v4
        with:
          path: ~/apt-i386
          key: apt-i386-v2-${{ steps.image.outputs.version }}-libssl3-libcurl4
      - name: Install rust-g
        run: |
          APT_DEB_CACHE=$HOME/apt-i386 bash tools/ci/apt_install.sh libssl3:i386 libcurl4:i386
          bash tools/ci/install_rust_g.sh
      - name: Install auxmos
        run: |
          bash tools/ci/install_auxmos.sh
      - name: Compile and run tests
        env:
          UNIT_TEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          source $HOME/BYOND/byond/bin/byondsetup
          tools/build/build --ci build -DCIBUILDING
          bash tools/ci/run_server.sh
      # AQUILA - ostrzezenia (nie blad), gdy nowy test albo cala czesc trwa za dlugo: przebieg CI ma zostac przy 6-7 min
      - name: Test times
        if: always()
        run: python3 tools/ci/check_test_times.py ci_test/data/logs/ci/tests.log || true
      # AQUILA - pelne logi serwera i wyniki testow do pobrania, gdy testy nie przejda
      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run_all_tests-logs-${{ matrix.shard }}
          path: |
            ci_test/data/logs/ci/
            ci_test/data/unit_tests.json
            ci_test/dd_output.log
          if-no-files-found: ignore
          retention-days: 14
  test_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: pwsh tools/ci/build.ps1
        env:
          DM_EXE: "C:\\byond\\bin\\dm.exe"

