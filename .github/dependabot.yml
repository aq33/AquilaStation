# AQUILA - cotygodniowe aktualizacje zależności (jak w tgstation). Pull requesty od Dependabota są zbiorcze: jeden
# na zestaw drobnych podbić (minor/patch) w TGUI i jeden na akcje GitHub. Duże wersje (major) idą pojedynczo, bo zwykle
# wymagają zmian w kodzie. Ten plik ustawia tylko harmonogram: osobne PR-y z poprawkami bezpieczeństwa (od razu, poza
# harmonogramem) przychodzą dopiero po włączeniu „Dependabot security updates” w ustawieniach repozytorium.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/tgui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "TGUI"
    groups:
      tgui-drobne:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "CI"
    groups:
      akcje-github:
        patterns:
          - "*"
