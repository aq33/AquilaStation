<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piaskownica AI</title>
<style>
:root{--bg:#0b0e14;--panel:#121722;--panel2:#171d2a;--ink:#e8ebf2;--muted:#8b93a7;--line:#232b3b;--nt:#4f9dff;--syn:#ff5a5f;--flee:#ffb020;--good:#3ecf8e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
main{max-width:1280px;margin:0 auto;padding:16px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:19px;font-weight:600;margin:0;letter-spacing:.2px}
.sub{color:var(--muted);font-size:13px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;background:#05070c;border:1px solid var(--line);border-radius:12px;overflow:hidden}
canvas{display:block;width:100%;height:auto}
.hud{position:absolute;left:12px;top:10px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;pointer-events:none}
.hud b{color:var(--ink);font-size:18px;font-weight:600;margin-right:6px}
.toasts{position:absolute;left:12px;bottom:12px;right:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{align-self:flex-start;background:rgba(18,23,34,.88);border:1px solid var(--line);border-left:3px solid var(--flee);padding:6px 10px;border-radius:6px;font-size:13px;max-width:90%;transition:opacity .4s}
.bar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button,select{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer}
button:hover{border-color:#3a465e}
.timeline{position:relative;flex:1;min-width:220px;height:28px}
.timeline input{position:absolute;inset:0;width:100%;margin:0;opacity:0;cursor:pointer}
.track{position:absolute;left:0;right:0;top:12px;height:4px;border-radius:2px;background:var(--line)}
.fill{position:absolute;left:0;top:12px;height:4px;border-radius:2px;background:var(--nt)}
.knob{position:absolute;top:7px;width:14px;height:14px;border-radius:50%;background:var(--ink);transform:translateX(-7px)}
.mark{position:absolute;top:4px;width:2px;height:20px;border-radius:1px;background:var(--flee);opacity:.7}
.t{font-variant-numeric:tabular-nums;color:var(--muted);min-width:88px;text-align:right;font-size:13px}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.card h2{font-size:13px;font-weight:600;color:var(--muted);text-transform:none;margin:0 0 8px;letter-spacing:.3px}
.fleet{margin-bottom:10px}
.fleet .fh{font-size:12.5px;color:var(--muted);margin:2px 0 4px;display:flex;align-items:center;gap:6px}
.ship{display:grid;grid-template-columns:minmax(0,1fr) 62px 62px;gap:8px;align-items:center;padding:3px 0;font-size:12.5px}
.ship .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ship .nm small{color:var(--muted)}
.ship.gone{opacity:.35}
.meter{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;transition:width .3s}
.ev{max-height:280px;overflow:auto;font-size:12.5px;scroll-behavior:smooth}
.ev div{padding:5px 0;border-bottom:1px solid var(--line);color:#5c657a;transition:color .3s}
.ev div.now{color:var(--ink)}
.ev b{font-variant-numeric:tabular-nums;font-weight:600;margin-right:6px;color:var(--muted)}
.leg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:8px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
label.chk{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;cursor:pointer}
@media (max-width:700px){.toast{font-size:11px;padding:4px 8px}.hud b{font-size:15px}}
</style>
</head>
<body>
<main>
<header><h1>Piaskownica AI: bitwa w systemie <span id="sys"></span></h1><span class="sub">Pusty serwer testowy. Okręt główny strzela według skryptu, cała reszta to AI. Pozycje względem okrętu głównego.</span></header>
<div class="wrap">
<div>
<div class="stage"><canvas id="cv" width="1600" height="1000"></canvas><div class="hud"><b id="clock">0:00</b><span id="count"></span></div><div class="toasts" id="toasts"></div></div>
<div class="bar">
<button id="play">▶ Odtwórz</button>
<select id="speed"><option value="2">2×</option><option value="4" selected>4×</option><option value="8">8×</option><option value="16">16×</option></select>
<div class="timeline" id="tl"><div class="track"></div><div class="fill" id="fill"></div><div class="knob" id="knob"></div><input id="seek" type="range" min="0" max="1000" value="0"></div>
<span class="t" id="tt"></span>
<label class="chk"><input type="checkbox" id="labels" checked> Nazwy</label>
<label class="chk"><input type="checkbox" id="lines" checked> Cele</label>
<label class="chk"><input type="checkbox" id="toastsOn"> Komunikaty na mapie</label>
</div>
<div class="leg"><span><span class="sw" style="background:var(--nt)"></span>Nanotrasen</span><span><span class="sw" style="background:var(--syn)"></span>Syndykat</span><span><span class="sw" style="border:2px solid var(--muted);background:transparent"></span>Flota wsparcia (obrys)</span><span><span class="sw" style="background:var(--flee)"></span>Ucieka</span><span>Łuk wokół okrętu: strach. Przerywana linia: cel.</span></div>
</div>
<div class="side">
<div class="card"><h2>Floty</h2><div id="fleets"></div></div>
<div class="card"><h2>Zdarzenia</h2><div class="ev" id="ev"></div></div>
</div>
</div>
</main>

  const target = {x: (x0 + x1) / 2, y: (y0 + y1) / 2, s: Math.min(14, Math.max(2.2, Math.min(sx, sy)))};
  const k = 1 - Math.exp(-dt * 1.8);
  cam.x += (target.x - cam.x) * k; cam.y += (target.y - cam.y) * k; cam.s += (target.s - cam.s) * k;
}
const P = (x, y) => [W / 2 + (x - cam.x) * cam.s, H / 2 - (y - cam.y) * cam.s];
function fearColor(f){ return f >= 85 ? '#ff4d4f' : f >= 60 ? '#ff8a3d' : f >= 30 ? '#ffc53d' : '#3ecf8e'; }
function drawShip(s, showLabel){
  const [px, py] = P(s.x, s.y);
  const col = COL[s.meta.f];
  const size = s.meta.tiny ? 6 : s.meta.main ? 20 : 14;
  cx.globalAlpha = s.alpha;
  // trail
  const tr = trail(s.id, t);
  if (tr.length > 1 && !s.meta.tiny){
    cx.strokeStyle = col; cx.lineWidth = 3.5; cx.lineCap = 'round';
    for (let n = 1; n < tr.length; n++){
      const [a, b] = P(tr[n - 1][0], tr[n - 1][1]), [c, d] = P(tr[n][0], tr[n][1]);
      cx.globalAlpha = s.alpha * 0.06 * n; cx.beginPath(); cx.moveTo(a, b); cx.lineTo(c, d); cx.stroke();
    }
    cx.globalAlpha = s.alpha;
  }
  if (s.goal === 'F'){
    const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 160);
    cx.strokeStyle = COL.flee; cx.lineWidth = 4; cx.globalAlpha = s.alpha * (0.45 + 0.55 * pulse);
    cx.beginPath(); cx.arc(px, py, size + 10, 0, Math.PI * 2); cx.stroke(); cx.globalAlpha = s.alpha;
  }
  if (!s.meta.tiny && !s.meta.main && s.meta.temp){
    cx.strokeStyle = fearColor(s.fear); cx.lineWidth = 4.5;
    cx.beginPath(); cx.arc(px, py, size + 5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0.02, s.fear / 100)); cx.stroke();
  }
  cx.save(); cx.translate(px, py); cx.rotate(s.ang * Math.PI / 180);
  cx.beginPath(); cx.moveTo(0, -size); cx.lineTo(size * 0.72, size * 0.8); cx.lineTo(0, size * 0.42); cx.lineTo(-size * 0.72, size * 0.8); cx.closePath();
  if (help[s.meta.fl]){ cx.strokeStyle = col; cx.lineWidth = 2; cx.fillStyle = '#05070c'; cx.fill(); cx.stroke(); }
  else { cx.fillStyle = col; cx.fill(); }
  cx.restore();
  if (showLabel && !s.meta.tiny){
    const name = s.meta.main ? s.meta.n : s.meta.n.split(' (')[0].split(' ').slice(0, 2).join(' ');
    cx.font = '600 20px "Segoe UI", system-ui'; cx.fillStyle = 'rgba(232,235,242,.6)';
    cx.fillText(name, px + size + 10, py - 4);
    if (!s.meta.main && !crowded){ cx.font = '17px "Segoe UI", system-ui'; cx.fillStyle = 'rgba(139,147,167,.6)'; cx.fillText(`${Math.round(s.hull)}% · strach ${Math.round(s.fear)}`, px + size + 10, py + 18); }
  }
  cx.globalAlpha = 1;
}
const bursts = [];
let crowded = false;
let lastFrameIndex = -1;
function draw(dt){
  const {ships, i} = state(t);
  updateCamera(ships, dt);
  cx.fillStyle = '#05070c'; cx.fillRect(0, 0, W, H);
  for (const [sx, sy, r, a] of stars){ cx.globalAlpha = a; cx.fillStyle = '#cfd8ff'; cx.beginPath(); cx.arc(sx * W, sy * H, r, 0, 7); cx.fill(); }
  cx.globalAlpha = 1;
  // grid every 10 tiles
  cx.strokeStyle = 'rgba(80,100,140,.10)'; cx.lineWidth = 1;
  const step = 10, gx0 = Math.floor((cam.x - W / 2 / cam.s) / step) * step, gy0 = Math.floor((cam.y - H / 2 / cam.s) / step) * step;
  for (let g = gx0; g < cam.x + W / 2 / cam.s; g += step){ const [a] = P(g, 0); cx.beginPath(); cx.moveTo(a, 0); cx.lineTo(a, H); cx.stroke(); }
  for (let g = gy0; g < cam.y + H / 2 / cam.s; g += step){ const [, b] = P(0, g); cx.beginPath(); cx.moveTo(0, b); cx.lineTo(W, b); cx.stroke(); }
  const by = new Map(ships.map(s => [s.id, s]));
  if (document.getElementById('lines').checked){
    cx.setLineDash([12, 10]); cx.lineWidth = 2.5;
    for (const s of ships){
      const tg = by.get(s.tgt); if (!tg) continue;
      const [a, b] = P(s.x, s.y), [c, d] = P(tg.x, tg.y);
      cx.strokeStyle = COL[s.meta.f]; cx.globalAlpha = (s.meta.tiny ? 0.12 : 0.3) * Math.min(s.alpha, tg.alpha);
      cx.beginPath(); cx.moveTo(a, b); cx.lineTo(c, d); cx.stroke();
    }
    cx.setLineDash([]); cx.globalAlpha = 1;
  }
  // Ships that disappear: explosion if destroyed, a blue streak if they jumped out
  if (i !== lastFrameIndex){
    if (lastFrameIndex >= 0 && i === lastFrameIndex + 1){
      for (const [id, r] of FR[lastFrameIndex].m) if (!FR[i].m.has(id) && lastSeen.get(id) === lastFrameIndex){
        const meta = D.ships[id]; if (meta.tiny) continue;
        const jumped = D.events.some(e => Math.abs(e[0] - FR[i].t) < 4 && /skok|wycofuje/i.test(e[1]) && e[1].includes(meta.n.split(' (')[0]));
        bursts.push({x: r[1], y: r[2], born: performance.now(), jump: jumped});
      }
    }
    lastFrameIndex = i;
  }
  for (let n = bursts.length - 1; n >= 0; n--){
    const b = bursts[n], age = (performance.now() - b.born) / 1200;
    if (age > 1){ bursts.splice(n, 1); continue; }
    const [px, py] = P(b.x, b.y);
    cx.globalAlpha = 1 - age; cx.strokeStyle = b.jump ? '#9ad1ff' : '#ffb020'; cx.lineWidth = 3;
    cx.beginPath(); cx.arc(px, py, 8 + age * 60, 0, 7); cx.stroke();
    if (!b.jump){ cx.fillStyle = '#ffdd88'; cx.beginPath(); cx.arc(px, py, Math.max(0, 14 * (1 - age * 1.6)), 0, 7); cx.fill(); }
    cx.globalAlpha = 1;
  }
  const showLabels = document.getElementById('labels').checked;
  crowded = ships.filter(s => !s.meta.tiny && s.alpha > 0.5).length > 14;
  for (const s of ships.filter(s => s.meta.tiny)) drawShip(s, false);
  for (const s of ships.filter(s => !s.meta.tiny)) drawShip(s, showLabels);
  // HUD
  const sec = Math.max(0, Math.round(t - T0));
  document.getElementById('clock').textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
  const caps = ships.filter(s => !s.meta.tiny && !s.meta.main && s.alpha > 0.5);
  document.getElementById('count').textContent = `NT ${caps.filter(s => s.meta.f === 'nt').length} · Syndykat ${caps.filter(s => s.meta.f === 'syn').length} okrętów`;
  const k = (t - T0) / (T1 - T0);
  document.getElementById('fill').style.width = (k * 100) + '%';
  document.getElementById('knob').style.left = (k * 100) + '%';
  document.getElementById('tt').textContent = `${sec} / ${Math.round(T1 - T0)} s`;
  return ships;
}
// Side panel: fleets and ships
function buildPanel(){
  const el = document.getElementById('fleets'); el.innerHTML = '';
  D.fleets.forEach((name, fi) => {
    const members = D.ships.map((m, id) => ({m, id})).filter(x => x.m.fl === fi && !x.m.tiny && !x.m.main);
    if (!members.length) return;
    const f = members[0].m.f;
    const box = document.createElement('div'); box.className = 'fleet';
    box.innerHTML = `<div class="fh"><span class="sw" style="${help[fi] ? `border:2px solid ${COL[f]}` : `background:${COL[f]}`}"></span>${name || 'Bez floty'}</div>` +
      members.map(x => `<div class="ship" id="row${x.id}"><div class="nm">${x.m.n.split(' (')[0]}<br><small id="st${x.id}">${x.m.temp || ''}</small></div><div><div class="meter"><i id="h${x.id}" style="background:#8b93a7"></i></div><small style="color:var(--muted)">kadłub</small></div><div><div class="meter"><i id="f${x.id}"></i></div><small style="color:var(--muted)">strach</small></div></div>`).join('');
    el.appendChild(box);
  });
}
function updatePanel(ships){
  const by = new Map(ships.map(s => [s.id, s]));
  D.ships.forEach((m, id) => {
    const row = document.getElementById('row' + id); if (!row) return;
    const s = by.get(id);
    row.classList.toggle('gone', !s);
    if (!s) return;
    document.getElementById('h' + id).style.width = Math.round(s.hull) + '%';
    const f = document.getElementById('f' + id); f.style.width = Math.round(s.fear) + '%'; f.style.background = fearColor(s.fear);
    document.getElementById('st' + id).textContent = (m.temp || '') + (s.goal === 'F' ? ' · ucieka' : '');
  });
}
const evEl = document.getElementById('ev');
evEl.innerHTML = D.events.map((e, n) => `<div id="e${n}"><b>${Math.floor(e[0] / 60)}:${String(Math.round(e[0] % 60)).padStart(2, '0')}</b>${e[1]}</div>`).join('');
const tl = document.getElementById('tl');
for (const e of D.events){ if (e[0] < T0 || e[0] > T1 || /^Koniec|^System|w systemie .*: \d+ okr/.test(e[1])) continue; const m = document.createElement('div'); m.className = 'mark'; m.style.left = ((e[0] - T0) / (T1 - T0) * 100) + '%'; m.title = e[1]; tl.insertBefore(m, tl.querySelector('input')); }
let shownEvents = new Set();
const toastsOn = document.getElementById('toastsOn');
// On a phone the messages cover the map, so they start switched off there
toastsOn.checked = window.innerWidth > 700;
toastsOn.onchange = () => { document.getElementById('toasts').style.display = toastsOn.checked ? '' : 'none'; };
toastsOn.onchange();
function updateEvents(){
  let latest = -1;
  D.events.forEach((e, n) => { const on = e[0] <= t; document.getElementById('e' + n).classList.toggle('now', on); if (on) latest = n; });
  if (latest >= 0 && playing){ const el = document.getElementById('e' + latest); if (el) evEl.scrollTop = el.offsetTop - evEl.offsetTop - 120; }
  if (!playing || !toastsOn.checked) return;
  D.events.forEach((e, n) => {
    if (e[0] <= t && e[0] > t - 1.5 && !shownEvents.has(n) && !/^Koniec|^System/.test(e[1])){
      shownEvents.add(n);
      const div = document.createElement('div'); div.className = 'toast'; div.textContent = e[1];
      if (/zniszczony/.test(e[1])) div.style.borderLeftColor = '#ff5a5f';
      if (/wzywa|odpowiada|posiłki|wsparcia/i.test(e[1])) div.style.borderLeftColor = '#4f9dff';
      const box = document.getElementById('toasts'); box.appendChild(div);
      while (box.children.length > 4) box.removeChild(box.firstChild);
      setTimeout(() => { div.style.opacity = 0; setTimeout(() => div.remove(), 450); }, 3800);
    }
  });
}
buildPanel();
function loop(now){
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing){ t += dt * +document.getElementById('speed').value; if (t >= T1){ t = T1; setPlaying(false); } }
  const ships = draw(dt);
  updatePanel(ships); updateEvents();
  requestAnimationFrame(loop);
}
function setPlaying(on){ playing = on; document.getElementById('play').textContent = on ? '❚❚ Pauza' : '▶ Odtwórz'; if (on && t >= T1) { t = T0; shownEvents.clear(); } }
document.getElementById('play').onclick = () => setPlaying(!playing);
document.getElementById('seek').oninput = e => { t = T0 + (T1 - T0) * (+e.target.value / 1000); shownEvents = new Set(D.events.map((e2, n) => e2[0] <= t ? n : -1)); lastFrameIndex = -1; };
document.addEventListener('keydown', e => { if (e.code === 'Space'){ e.preventDefault(); setPlaying(!playing); } });
requestAnimationFrame(loop);
</script>
