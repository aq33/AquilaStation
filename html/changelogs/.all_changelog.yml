      \ z\u0142omiarza oraz osobna preferencja roli \u201EZ\u0142omiarz\u201D."
  - rscadd: "Wypr\xF3\u017Cnianie pokazuje typ stolca w skali bristolskiej. Typ zale\u017C\
      y od diety (warzywa i owoce kontra mi\u0119so, t\u0142uszcz i s\u0142odycze),\
      \ ruchu, nawodnienia, kawy i ostrego jedzenia oraz nastroju, a po wypr\xF3\u017C\
      nieniu wida\u0107 mo\u017Cliwe przyczyny."
  - balance: "Przy zaparciu potrzeba skorzystania z ubikacji ro\u015Bnie wolniej,\
      \ ale wypr\xF3\u017Cnienie trwa d\u0142u\u017Cej. Przy biegunce potrzeba ro\u015B\
      nie szybciej, a popuszczenie przychodzi wcze\u015Bniej. Wypr\xF3\u017Cnienie\
      \ daje moodlet zale\u017Cny od typu."
  - rscadd: "Typ stolca wida\u0107 przy ogl\u0119dzinach kupy, a tooltip alertu potrzeby\
      \ ostrzega przed zaparciem albo biegunk\u0105."
  - rscadd: "Nawodnienie daje moodlety i zmienia regeneracj\u0119 staminy: premia\
      \ przy dobrym nawodnieniu, kara przy pragnieniu."
  - rscadd: "Najedzenie ma wi\u0119cej skutk\xF3w: senno\u015B\u0107 po przejedzeniu,\
      \ burczenie w brzuchu, dr\u017Cenie r\u0105k z g\u0142odu, szybsze gojenie siniak\xF3\
      w po sytym posi\u0142ku."
  - rscadd: "Cukier daje zastrzyk energii i spadek, kofeina przyspiesza regeneracj\u0119\
      \ staminy, bia\u0142ko odbudowuje krew, t\u0142uszcz d\u0142u\u017Cej syci,\
      \ a mleko os\u0142ania \u017Co\u0142\u0105dek."
  - rscadd: "Przyprawy maj\u0105 zalety: s\xF3l zatrzymuje wod\u0119, pieprz zbija\
      \ obrzydzenie, ostry sos t\u0142umi b\xF3l. Danie doprawione r\u0119cznie jest\
      \ smaczniejsze."
  - rscadd: "Urozmaicona dieta daje moodlet i troch\u0119 syto\u015Bci."
  - rscadd: "Wrzody \u017Co\u0142\u0105dka od \u015Bmieciowego jedzenia, sma\u017C\
      onego, z automat\xF3w i s\u0142odkich napoj\xF3w gazowanych. Trzy stadia, widoczne\
      \ w analizatorze zdrowia, leczone mlekiem, nowym lekiem Omeprazol albo gastrektomi\u0105\
      ."
  - balance: "Kawa nawadnia s\u0142abiej ni\u017C woda i soki."
  - rscadd: "Skaner maszyn zapisuje schemat maszyny z tierem cz\u0119\u015Bci, a czytnik\
      \ schemat\xF3w wpisuje go do bazy sieci bada\u0144."
  - rscadd: "Flatpacker robi paczki z maszynami z p\u0142ytki albo ze schematu z bazy;\
      \ paczk\u0119 rozk\u0142ada si\u0119 multitoolem."
  - rscadd: "Pakownica maszyn sk\u0142ada dzia\u0142aj\u0105c\u0105 maszyn\u0119 w\
      \ paczk\u0119 razem z jej cz\u0119\u015Bciami."
  - rscadd: "W\xF3zek na paczki mie\u015Bci trzy paczki."
  - rscadd: "Nowy w\u0119ze\u0142 bada\u0144 \u201EIn\u017Cynieria wsteczna\u201D."
  - rscadd: "W uplinku skaner i pakownica bez blokad, kt\xF3re bior\u0105 te\u017C\
      \ uzbrojenie, konsole okr\u0119tu i sprz\u0119t ochrony."
  - rscadd: "Flatpacker, skaner, pakownica i czytnik schemat\xF3w w paczce stoj\u0105\
      \ w in\u017Cynierii na mapach (poza Shrike)."
  - imageadd: "Sprite'y flatpackera, paczki i w\xF3zka z tgstation oraz skanera, pakownicy\
      \ i czytnika z Goonstation."
  - rscadd: "Gdy serwer ma w\u0142\u0105czony syntezator mowy, przycisk og\u0142oszenia\
      \ SI przyjmuje dowolny tekst po polsku i czyta go g\u0142osem zamiast s\u0142\
      \xF3w VOX."
  - config: "Nowe opcje AI_TTS_VOICE (g\u0142os og\u0142osze\u0144 SI) i AI_TTS_FFMPEG\
      \ (ffmpeg do filtra brzmienia og\u0142osze\u0144) w squad_tts.txt; og\u0142\
      oszenia SI zu\u017Cywaj\u0105 wsp\xF3lny z dru\u017Cynami limit znak\xF3w na\
      \ rund\u0119."
  - bugfix: "Przyciski HUD-u SI mieszcz\u0105 si\u0119 w widoku; po prawej stronie\
      \ widoku SI nie znikaj\u0105 ju\u017C \u015Bciany i obiekty."
