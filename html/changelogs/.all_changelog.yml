  - tweak: The plasma loader board is now protected.
  - tweak: The plasma caster board is now better protected.
  - tweak: The plasma caster & loader boards can now be tracked.
  - bugfix: Singularities no longer infinitely suck out material from reinforced floors.
  - bugfix: Reinforced floors are now more resistant to ranged singularity pulls
  - bugfix: Openspace is now unaffected by singularities.
  - tweak: Relayed projectiles now have a higher degree of targeting randomness.
  - tweak: Relayed projectile starting sides are now determined by the angle of the
      original projectile.
  - tweak: Projectile impact quadrants are now determined by projectile facing rather
      than relative position to ship (hopefully feels more accurate).
